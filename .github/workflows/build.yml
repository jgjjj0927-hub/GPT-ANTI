
name: ANTI-VURUS CI and Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and Security Audit
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Compile Python files
        run: python -m compileall -q core telegram ui main.py main_window.py

      - name: Run tests
        run: python -m pytest tests/test.py -v

      - name: Dependency security audit
        run: pip-audit -r requirements.txt

  build:
    name: Build Windows EXE with Nuitka
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Check project structure
        shell: pwsh
        run: |
          $required = @(
            "main.py",
            "main_window.py",
            "requirements.txt",
            "assets/shield-2.ico",
            "core",
            "telegram",
            "ui",
            "tests/test.py",
            "website"
          )

          foreach ($item in $required) {
            if (!(Test-Path $item)) {
              Write-Error "Required file or directory not found: $item"
              exit 1
            }
          }

          Write-Host "Project structure OK."

      - name: Build with Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --enable-plugin=pyqt6 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets/shield-2.ico `
            --output-filename=ANTI-VURUS.exe `
            --assume-yes-for-downloads `
            --include-package=core `
            --include-package=telegram `
            --include-package=ui `
            --include-package=requests `
            --include-package=watchdog `
            --include-package=dotenv `
            main.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "ANTI-VURUS.exe")) {
            Write-Error "ANTI-VURUS.exe was not created."
            exit 1
          }

          Write-Host "Executable created successfully."

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ANTI-VURUS-Windows
          path: ANTI-VURUS.exe
          if-no-files-found: error
          retention-days: 14
